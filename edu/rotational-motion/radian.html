<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الراديان وطول القوس</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   محطة من منصّة وصف الحركة الدورانية (معمار المسرح الواحد)
   أربعة تابات بترتيب ثابت: افهم ← شاهد ← نفّذ ← اختبر
   كل موضع بين قوسين مزدوجين يُستبدل. كل ما هو معلَّم بـ «مثال» محتوى تجريبي يُستبدل بمحتوى المادة.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#0d1117; --panel:#151b23; --panel2:#1c2530; --panel3:#222d3a;
  --line:#2b3644; --txt:#e6edf3; --muted:#96a3b3; --dim:#6b7a8c;
  --accent:#4dabf7; --accent2:#845ef7;
  --ok:#37b24d; --okbg:#0f2a17; --warn:#f59f00; --warnbg:#2b1f05;
  --bad:#f03e3e; --badbg:#2b1113; --gold:#ffd43b;
  /* ألوان الأدوار — لون لكل دور لا لكل عنصر */
  --role1:#e64980; --role2:#37b24d; --role3:#f59f00; --prod:#845ef7;
  --r:14px; --r2:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:0}
body{background:radial-gradient(1200px 600px at 50% -10%,#1b2735 0%,var(--bg) 60%);
  color:var(--txt);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
body[dir=ltr]{font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
.shell{max-width:1180px;margin:0 auto;padding:14px 16px 56px}
h1,h2,h3,h4{margin:0} p{margin:0 0 10px} button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

header.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:linear-gradient(135deg,#1b2735,#0f1620);border:1px solid var(--line);
  border-radius:var(--r);padding:13px 18px;margin-bottom:12px}
header.top .brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:42px;height:42px;border-radius:12px;flex:none;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-weight:800;font-size:.95rem;color:#fff;overflow:hidden}
header.top h1{font-size:1.08rem;font-weight:700;line-height:1.35}
header.top .sub{font-size:.76rem;color:var(--muted);margin-top:2px}
.btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:var(--r2);
  padding:8px 14px;cursor:pointer;font-size:.88rem;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--accent);background:#22303f}
.btn.primary{background:linear-gradient(135deg,#1d4ed8,#6d28d9);border-color:transparent;color:#fff;font-weight:600}
.btn.sm{padding:5px 11px;font-size:.8rem;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* التابات الأربعة */
nav.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}
nav.stages button{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:var(--r);
  padding:12px 10px;cursor:pointer;transition:.18s;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
nav.stages button .ic{font-size:1.25rem;line-height:1}
nav.stages button .t{font-size:.93rem;font-weight:700}
nav.stages button:hover{border-color:var(--accent);color:var(--txt)}
nav.stages button.active{background:linear-gradient(135deg,#1d4ed822,#845ef722);border-color:var(--accent);color:#fff;
  box-shadow:0 0 0 1px var(--accent) inset}
nav.stages button .dot{position:absolute;inset-inline-end:9px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--ok);display:none}
nav.stages button.done .dot{display:block}
@media(max-width:640px){nav.stages{grid-template-columns:repeat(2,1fr)}}
.pane{display:none;animation:fade .22s ease} .pane.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.card h3{font-size:1.02rem;margin-bottom:8px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tag{font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--panel3);color:var(--muted);
  border:1px solid var(--line);white-space:nowrap}
.tag.ok{background:var(--okbg);color:#7ee39a;border-color:#1d5c31}
.tag.lock{background:#2a2118;color:#e0b070;border-color:#5c4423}

/* الفصول (رقائق التنقّل داخل الرحلة الواحدة) */
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.act{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 12px;
  font-size:.79rem;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px}
.act.active{background:linear-gradient(135deg,#1d4ed833,#845ef733);border-color:var(--accent);color:#fff;font-weight:700}
.act .n{display:grid;place-items:center;width:18px;height:18px;border-radius:6px;background:var(--panel3);font-size:.68rem;font-weight:700}
.act.active .n{background:var(--accent);color:#06121f}
.act.past{color:var(--txt);border-color:#33506e}

/* المسرح الواحد */
.stagebox{background:linear-gradient(180deg,#0f1620,#0c1219);border:1px solid var(--line);border-radius:var(--r);
  padding:8px;margin-bottom:10px;overflow:hidden;position:relative}
.stagebox svg{display:block;width:100%;height:auto}
.locbadge{position:absolute;inset-inline-start:16px;top:16px;background:#0b1420cc;border:1px solid var(--line);
  border-radius:999px;padding:4px 13px;font-size:.76rem;color:var(--accent)}
.ctrl{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.ctrl .steplbl{font-size:.8rem;color:var(--muted);min-width:74px}
.spd{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.spd select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:5px 9px;
  font-family:inherit;font-size:.8rem;cursor:pointer;direction:ltr}
.bar{flex:1 1 160px;height:7px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;overflow:hidden;min-width:110px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .3s}
.cap{background:var(--panel2);border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:var(--r2);
  padding:11px 14px;font-size:.93rem;min-height:64px}
.cap b{color:#fff}

/* شريط الأدوار الدائم */
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:11px 0 0}
@media(max-width:700px){.roles{grid-template-columns:1fr}}
.role{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:9px 12px;opacity:.4;transition:.28s;
  position:relative;overflow:hidden}
.role::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:currentColor}
.role.on{opacity:1;background:var(--panel3);box-shadow:0 0 0 1px currentColor inset}
.role .hd{display:flex;align-items:center;gap:8px}
.role .gl{width:26px;height:26px;flex:none;border-radius:7px;background:currentColor}
.role .nm{font-weight:800;font-size:.92rem;color:currentColor}
.role .job{font-size:.75rem;color:var(--muted);font-weight:700}
.role .now{font-size:.79rem;margin-top:6px;color:var(--txt);line-height:1.55;border-top:1px dashed #ffffff1f;padding-top:6px;display:none}
.role.on .now{display:block}
.role .idle{font-size:.75rem;color:var(--dim);margin-top:6px}

/* نفّذ — كل المهام مفتوحة، وتنقّل حرّ بينها (قرار عماد 2026-09-29) */
.tnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tchip{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 13px;
  font-size:.8rem;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:7px;font-family:inherit}
.tchip:hover{border-color:var(--accent);color:var(--txt)}
.tchip .n{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--panel3);font-size:.7rem;font-weight:800}
.tchip.done{border-color:#1d5c31;color:var(--txt)}
.tchip.done .n{background:var(--ok);color:#06121f}
.tchip.active{background:linear-gradient(135deg,#1d4ed833,#845ef733);border-color:var(--accent);color:#fff;font-weight:700}
.tchip.active .n{background:var(--accent);color:#06121f}
.tchip.active.done .n{background:var(--ok)}
.tfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px;flex-wrap:wrap}
.tfoot .cnt{font-size:.82rem;color:var(--muted)}
.pool{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.piece{background:var(--panel3);border:1px solid var(--line);border-radius:var(--r2);padding:8px 14px;font-size:.86rem;
  cursor:pointer;transition:.15s;user-select:none}
.piece:hover{border-color:var(--accent);transform:translateY(-2px)}
.piece.used{opacity:.28;pointer-events:none}
.piece.sel{border-color:var(--accent);background:#22303f}
.fb{border-radius:var(--r2);padding:10px 13px;font-size:.88rem;margin-top:10px;display:none}
.fb.show{display:block}
.fb.good{background:var(--okbg);border:1px solid var(--ok)}
.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.fb.hint{background:var(--warnbg);border:1px solid var(--warn)}
.mini{background:#0c1219;border:1px solid var(--line);border-radius:var(--r2);padding:6px;margin:10px 0}
.mini svg{display:block;width:100%;height:auto}
.prog{font-size:.8rem;color:var(--muted);margin-top:4px}

/* افهم */
.read h4{font-size:.98rem;color:var(--accent);margin:16px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.read p{font-size:.95rem}
.keybox{background:linear-gradient(135deg,#152034,#101823);border:1px solid #24405e;border-inline-start:4px solid var(--gold);
  border-radius:var(--r2);padding:12px 15px;margin:12px 0;font-size:.93rem}
.keybox .lbl{font-size:.72rem;font-weight:700;color:var(--gold);letter-spacing:.5px;margin-bottom:4px}
table.t{width:100%;border-collapse:collapse;font-size:.88rem;margin:10px 0}
table.t th,table.t td{border:1px solid var(--line);padding:8px 11px;text-align:start;vertical-align:top}
table.t th{background:var(--panel3);font-weight:700;font-size:.83rem}
.tblwrap{overflow-x:auto}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:9px;margin-top:8px}
.gitem{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:11px 13px}
.gitem .ar{font-weight:700;font-size:.95rem}
.gitem .en{font-size:.82rem;color:var(--accent);direction:ltr;unicode-bidi:isolate;margin:2px 0 5px}
.gitem .d{font-size:.85rem;color:var(--muted);line-height:1.6}

/* اختبر */
.q{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;margin-bottom:11px}
.qh{display:flex;gap:11px;align-items:flex-start;margin-bottom:4px}
.num{flex:none;display:grid;place-items:center;width:27px;height:27px;border-radius:8px;background:var(--panel2);
  border:1px solid var(--line);font-size:.8rem;font-weight:700;color:var(--muted)}
.q.right .num{background:var(--okbg);border-color:var(--ok);color:#7ee39a}
.q.wrong .num{background:var(--badbg);border-color:var(--bad);color:#ff9a9a}
.stem{font-size:.97rem;flex:1}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
ul.opts{list-style:none;margin:11px 0 0;padding:0;display:grid;gap:6px}
ul.opts li{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:9px;background:var(--panel2);
  border:1px solid transparent;font-size:.91rem;color:var(--muted);cursor:pointer;transition:.15s}
ul.opts li:hover{border-color:var(--accent);color:var(--txt)}
ul.opts li .k{flex:none;width:21px;height:21px;border-radius:6px;background:var(--panel3);display:grid;place-items:center;font-size:.75rem;font-weight:700}
ul.opts li.sel{border-color:var(--accent);color:var(--txt)}
.q.done ul.opts li,.q.done .tile,.q.done .mitem,.q.done .tfbtn{cursor:default;pointer-events:none}
.q.done li.correct,.q.done .tile.correct,.q.done .mitem.correct,.q.done .tfbtn.correct{background:var(--okbg);border-color:var(--ok);color:var(--txt);font-weight:600}
.q.done li.miss,.q.done .tile.miss,.q.done .mitem.miss,.q.done .tfbtn.miss{background:var(--badbg);border-color:var(--bad);color:var(--txt)}
.q.done li.missed{border:1px dashed var(--ok);color:var(--txt)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:12px;text-align:center;cursor:pointer;font-size:.9rem}
.tile:hover{border-color:var(--accent)}
.tfrow{display:flex;gap:10px;margin-top:10px}
.tfbtn{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:var(--r2);padding:11px;cursor:pointer;font-size:.92rem}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;margin-top:10px}
.mcol{display:grid;gap:7px}
.mitem{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:9px 11px;cursor:pointer;font-size:.88rem;display:flex;gap:8px;align-items:center}
.mitem.sel{border-color:var(--accent);background:#22303f}
.mitem.paired{border-style:solid;border-color:#33506e}
.mitem .n{flex:none;width:20px;height:20px;border-radius:6px;background:var(--panel3);display:grid;place-items:center;font-size:.72rem;font-weight:700}
.mlink{align-self:center;color:var(--dim)}
.actions{margin-top:10px}
.exp{margin-top:10px;border-radius:var(--r2);padding:10px 13px;font-size:.89rem;line-height:1.65}
.exp.good{background:var(--okbg);border:1px solid #1d5c31}
.exp.bad{background:var(--badbg);border:1px solid #6b2226}
.exp .nud{margin-top:7px;padding-top:7px;border-top:1px dashed #ffffff22;color:var(--gold);font-size:.85rem}
.score{background:linear-gradient(135deg,#152034,#101823);border:1px solid #24405e;border-radius:var(--r);padding:15px 18px;
  margin-bottom:12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.score .big{font-size:1.7rem;font-weight:800}
.score .lbl{font-size:.82rem;color:var(--muted)}
.skillbars{display:grid;gap:7px;margin-top:10px;flex:1 1 260px}
.sb{display:flex;align-items:center;gap:9px;font-size:.8rem}
.sb .nm{flex:1 1 auto;color:var(--muted)}
.sb .tr{flex:0 0 96px;height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.sb .tr i{display:block;height:100%;background:var(--ok)}
footer.note{margin-top:20px;font-size:.76rem;color:var(--dim);text-align:center;line-height:1.8}
</style>
</head>
<body>
<div class="shell wrap">

<header class="top">
  <div class="brand">
    <div class="logo">1.1</div>
    <div><h1 id="hTitle"></h1><div class="sub" id="hSub"></div></div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="btn sm" id="resetBtn"></button>
    <button class="btn" id="langBtn">English</button>
  </div>
</header>

<nav class="stages" id="stageNav"></nav>

<!-- 1 · افهم -->
<section class="pane" id="pane-read"><div id="readWrap"></div></section>

<!-- 2 · شاهد -->
<section class="pane" id="pane-watch">
  <div class="acts" id="actChips"></div>
  <div class="card" style="padding:14px 16px">
    <h3 id="sceneTitle"></h3>
    <div class="stagebox"><div class="locbadge" id="locBadge"></div><div id="sceneSvg"></div></div>
    <div class="ctrl">
      <button class="btn sm" id="btnPrev"></button>
      <button class="btn sm primary" id="btnPlay"></button>
      <button class="btn sm" id="btnNext"></button>
      <label class="spd"><span id="spdLbl"></span>
        <select id="spdSel">
          <option value="0.5">×0.5</option><option value="0.75">×0.75</option><option value="1" selected>×1</option>
          <option value="1.5">×1.5</option><option value="2">×2</option><option value="3">×3</option>
        </select></label>
      <span class="steplbl" id="stepLbl"></span>
      <div class="bar"><i id="stepBar"></i></div>
    </div>
    <div class="cap" id="sceneCap"></div>
    <div class="roles" id="roleBar"></div>
  </div>
</section>

<!-- 3 · نفّذ -->
<section class="pane" id="pane-do"><div id="doWrap"></div></section>

<!-- 4 · اختبر -->
<section class="pane" id="pane-test">
  <div class="score" id="scoreBox"></div>
  <div id="quizWrap"></div>
</section>

<footer class="note" id="foot"></footer>
</div>
<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════
   0 · الأساس المشترك — لا يُعدَّل
   ═══════════════════════════════════════════════════════════════ */
let LANG = "ar";
const T  = o => !o ? "" : (typeof o === "string" ? o : (o[LANG] || o.ar || o.en || ""));
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const NS = 'xmlns="http://www.w3.org/2000/svg"';
const SV = (vb, inner) => `<svg viewBox="${vb}" ${NS} font-family="IBM Plex Sans Arabic,Segoe UI,Tahoma,Arial,sans-serif">${inner}</svg>`;
const ltr = s => `⁦${s}⁩`;                       /* عزل رمز أو تسلسل لاتيني داخل نصّ عربي */
/* أي خيار أو مسمّى بلا حروف عربية يُلَفّ بـ span.ltr وإلا انقلب في الصفحة العربية */
const OT = o => { const s = T(o); return /[؀-ۿ]/.test(s) ? s : `<span class="ltr">${s}</span>`; };

/* ---- الكاميرا: CK معامل التكبير الحالي. كل مقاس نصّ أو حدّ يُقسَم عليه حتى يبقى
        ما تراه العين بالحجم نفسه مهما اقتربت الكاميرا. هذه النقطة التي تنكسر إن نُسيت. ---- */
let CK = 1, CAMR = null;
const F  = s => (s / CK).toFixed(2);
const SW = s => (s / CK).toFixed(2);
function tx(x, y, s, o){ o = o || {};
  return `<text x="${x}" y="${y}" fill="${o.f || '#e6edf3'}" font-size="${F(o.s || 14)}" text-anchor="${o.a || 'middle'}"
   font-weight="${o.w || 400}" opacity="${o.o == null ? 1 : o.o}" ${o.extra || ''}>${s}</text>`; }
function rc(x, y, w, h, o){ o = o || {};
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.r == null ? 8 : o.r}" fill="${o.f || 'none'}"
   stroke="${o.s || 'none'}" stroke-width="${SW(o.sw || 1.5)}" opacity="${o.o == null ? 1 : o.o}" ${o.extra || ''}/>`; }
const cir = (cx, cy, r, o) => { o = o || {}; return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${o.f || 'none'}"
   stroke="${o.s || 'none'}" stroke-width="${SW(o.sw || 1.5)}" opacity="${o.o == null ? 1 : o.o}"/>`; };
const ln = (x1, y1, x2, y2, o) => { o = o || {}; return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.s || '#2b3644'}"
   stroke-width="${SW(o.sw || 2)}" stroke-dasharray="${o.d || 'none'}" stroke-linecap="round" opacity="${o.o == null ? 1 : o.o}"/>`; };

/* ---- قياس النصّ قبل رسمه: لا يُرسم نصّ طويل بـ tx مباشرة، بل بـ txFit أو داخل card ---- */
let _MC = null;
function _ctx(){ if (_MC !== null) return _MC; try{ _MC = document.createElement("canvas").getContext("2d"); }catch(e){ _MC = false; } return _MC; }
const FONT = '"IBM Plex Sans Arabic",Segoe UI,Tahoma,Arial,sans-serif';
function k1(str, weight){                                  /* عرض النصّ عند حجم خط 1 */
  const c = _ctx(); if (!c) return String(str).length * .52;
  c.font = (weight || 400) + " 100px " + FONT; return c.measureText(String(str)).width / 100; }
const wWidth = (str, s, weight) => (s / CK) * k1(str, weight);          /* العرض بوحدات العالم */
function fitSize(str, boxW, maxS, weight){ const k = k1(str, weight) || .5; return Math.max(8, Math.min(maxS, (boxW * CK) / k)); }
function wrapWorld(str, boxW, s, weight){
  const words = String(str).split(/\s+/), out = []; let cur = "";
  words.forEach(w => { const t = cur ? cur + " " + w : w; if (!cur || wWidth(t, s, weight) <= boxW) cur = t; else { out.push(cur); cur = w; } });
  if (cur) out.push(cur); return out; }
function txFit(x, y, str, maxW, maxS, o){ o = o || {}; return tx(x, y, str, Object.assign({}, o, {s: fitSize(str, maxW, maxS, o.w || 700)})); }
/* بطاقة ارتفاعها ناتج من محتواها، ومحتواها يُقلَّص أو يُلَفّ ليتّسع. لون التعبئة #0d1826 هو ما يتعرّف به حارس التخطيط على البطاقات */
function card(x, y, w, lines, o){ o = o || {};
  const pad = o.pad == null ? 34 : o.pad, inner = w - pad * 2, rows = []; let H = pad;
  lines.forEach(L => {
    const maxS = L.s || 30, wt = L.w || 700, str = T(L.t);
    let s = fitSize(str, inner, maxS, wt), subs = [str];
    if (s < maxS * .74){ s = maxS; subs = wrapWorld(str, inner, s, wt); let g = 0;
      while (subs.some(t => wWidth(t, s, wt) > inner) && g++ < 60){ s -= 1; subs = wrapWorld(str, inner, s, wt); } }
    subs.forEach(t => { H += (s / CK) * 1.06; rows.push({t, s, wt, c: L.c, y: H}); H += (s / CK) * .36; });
    H += (L.gap == null ? 14 : L.gap); });
  H += pad - 14;
  let g = rc(x, y, w, H, {f: o.f || "#0d1826f4", s: o.s || "#4dabf7", sw: 5, r: 26});
  rows.forEach(r => { g += tx(x + w/2, y + r.y, r.t, {f: r.c || "#e6edf3", s: r.s, w: r.wt}); });
  return g; }

/* ═══════════════════════════════════════════════════════════════
   1 · العالم — قرص دوّار واحد لكل المنصّة
   قرص نصف قطره 3 m، عليه ثلاثة راكبين على نصف قطر واحد عند 1 و2 و3 m.
   الأدوار بلون ثابت في كل المحطات: نصف القطر أزرق · القوس أخضر · الزاوية برتقالي.
   ═══════════════════════════════════════════════════════════════ */
const WW = 2000, WH = 1240;
const CLR = {rad:"#4dabf7", radL:"#a5d8ff", arc:"#37b24d", arcL:"#8ce99a", ang:"#f59f00", angL:"#ffc078",
             gold:"#ffd43b", txt:"#e6edf3", muted:"#96a3b3", rim:"#2f5276"};
const C = {x:620, y:620}, R = 420, RID = [140, 280, 420];          /* 140 وحدة = 1 m */
const PI = Math.PI, TAU = 2 * Math.PI;
const P = (r, a) => [C.x + r * Math.cos(a), C.y - r * Math.sin(a)];  /* عكس عقارب الساعة موجب */
const f1 = v => (+v).toFixed(1);
const M = s => `<span class="ltr">${s}</span>`;                     /* رمز لاتيني داخل نصّ HTML عربي */

/* الكاميرات: [x, y, w] — الارتفاع دائماً = العرض × 0.62 */
const CAMS = { wide:[0, 0, 2000], rim:[480, 170, 800], arcs:[420, 160, 1000] };
const LOC  = { wide:{ar:"القرص كاملاً", en:"the whole disc"}, rim:{ar:"عند الحافة", en:"at the rim"},
               arcs:{ar:"أقواس الراكبين", en:"the riders' arcs"} };

const inCam = (x0, y0, x1, y1) => CAMR && x0 >= CAMR.x && x1 <= CAMR.x + CAMR.w && y0 >= CAMR.y && y1 <= CAMR.y + CAMR.h;
/* مسمّى يُرسم فقط إن وقع كاملاً داخل الكاميرا. y هو مركز السطر عمودياً */
function lab(x, y, str, s, o){ o = o || {}; const wt = o.w || 700, w = wWidth(str, s, wt), h = s / CK;
  if (!inCam(x - w/2 - 4, y - h * .6, x + w/2 + 4, y + h * .5)) return "";
  return tx(x, y + h * .35, str, Object.assign({}, o, {s, w:wt})); }
/* مسمّى لاتيني خالص — الاتجاه على عنصر النصّ نفسه */
const labL = (x, y, str, s, o) => lab(x, y, str, s, Object.assign({}, o || {}, {extra:'direction="ltr"'}));
const path = (d, o) => { o = o || {}; return d ? `<path d="${d}" fill="${o.f || 'none'}" stroke="${o.s || 'none'}" stroke-width="${SW(o.sw || 2)}"
   stroke-linecap="${o.cap || 'round'}" opacity="${o.o == null ? 1 : o.o}"/>` : ""; };
function arcD(r, a0, a1){ const d = a1 - a0; if (d <= 1e-6) return "";
  if (d >= TAU - 1e-6){ const [x0,y0] = P(r, 0), [x1,y1] = P(r, PI);
    return `M${f1(x0)},${f1(y0)} A${r},${r} 0 1 0 ${f1(x1)},${f1(y1)} A${r},${r} 0 1 0 ${f1(x0)},${f1(y0)}`; }
  const [x0,y0] = P(r, a0), [x1,y1] = P(r, a1);
  return `M${f1(x0)},${f1(y0)} A${r},${r} 0 ${d > PI ? 1 : 0} 0 ${f1(x1)},${f1(y1)}`; }
const degOf = a => a * 180 / PI;

function mk(o){ return Object.assign({rot:0, riders:0, rlab:0, ref:1, axis:0, radLine:0, straight:0, strings:0, sEqR:0, radEnd:0, radRot:0,
  wedge:0, wl:"", arcs:0, arcShow:[1,1,1], arcLab:0, arcTxt:null, hlRider:-1, deg:0, board:null, overlay:null}, o || {}); }

function world(S){
  let g = rc(0, 0, WW, WH, {f:"#0b1119", r:0});
  /* حلقة الدرجات */
  if (S.deg){
    for (let k = 0; k < 12; k++){ const a = k * PI / 6, [x0,y0] = P(R + 4, a), [x1,y1] = P(R + (k % 3 ? 16 : 30), a);
      g += ln(x0, y0, x1, y1, {s:"#4b6a8c", sw:k % 3 ? 1.5 : 2.5}); }
    [[0,"0°"], [PI/2,"90°"], [PI,"180°"], [1.5*PI,"270°"]].forEach(([a,t]) => { const [x,y] = P(R + 78, a); g += labL(x, y, t, 17, {f:CLR.muted}); });
  }
  /* القرص ومسارات الراكبين */
  g += cir(C.x, C.y, R, {f:"#122034", s:CLR.rim, sw:3});
  g += cir(C.x, C.y, RID[0], {s:"#1f3149", sw:1.2}) + cir(C.x, C.y, RID[1], {s:"#1f3149", sw:1.2});
  for (let k = 0; k < 4; k++){ const [x,y] = P(R - 6, S.rot + k * PI / 2); g += ln(C.x, C.y, x, y, {s:"#1d3049", sw:2}); }
  /* خط الإسناد */
  if (S.ref){ g += ln(C.x, C.y, C.x + R + (S.deg ? 40 : 110), C.y, {s:"#7d8ea3", sw:1.8, d:"10 8"});
    if (!S.deg) g += lab(C.x + R + 10, C.y + 44, T({ar:"خط الإسناد", en:"reference line"}), 15, {f:CLR.muted}); }
  /* الزاوية (الدور 3) */
  if (S.wedge > 0){ const w = Math.min(S.wedge, TAU);
    if (w >= TAU - 1e-6) g += cir(C.x, C.y, 110, {f:"#f59f0033", s:CLR.ang, sw:2.5});
    else { const [x0,y0] = P(110, 0), [x1,y1] = P(110, w);
      g += path(`M${C.x},${C.y} L${f1(x0)},${f1(y0)} A110,110 0 ${w > PI ? 1 : 0} 0 ${f1(x1)},${f1(y1)} Z`, {f:"#f59f0033", s:CLR.ang, sw:2.5}); }
    if (S.wl){ const [lx,ly] = P(68, w >= TAU - 1e-6 ? PI : w / 2); g += labL(lx, ly, S.wl, 17, {f:CLR.angL, w:800}); }
  }
  /* نصف القطر (الدور 1) */
  if (S.radLine){ const [x,y] = P(R, 0); g += ln(C.x, C.y, x, y, {s:CLR.rad, sw:4});
    g += labL(C.x + R / 2, C.y + 32, "r = 3 m", 16, {f:CLR.rad}); }
  if (S.radEnd && S.strings > 0 && S.strings < TAU - 1e-6){ const [x,y] = P(R, S.strings); g += ln(C.x, C.y, x, y, {s:CLR.rad, sw:3, o:.8}); }
  if (S.radRot && S.rot > 0){ const [x,y] = P(R, S.rot); g += ln(C.x, C.y, x, y, {s:CLR.rad, sw:3, o:.75}); }
  if (S.straight){ g += ln(C.x, C.y - 46, C.x + R, C.y - 46, {s:CLR.radL, sw:9});
    g += ln(C.x, C.y - 60, C.x, C.y - 32, {s:CLR.radL, sw:2}) + ln(C.x + R, C.y - 60, C.x + R, C.y - 32, {s:CLR.radL, sw:2});
    g += lab(C.x + R / 2, C.y - 76, T({ar:"خيط طوله r", en:"a string of length r"}), 16, {f:CLR.radL}); }
  /* خيوط بطول نصف القطر ملفوفة على الحافة */
  if (S.strings > 0){ const n = Math.min(S.strings, TAU);
    for (let k = 0; k < n - 1e-6; k++){ const a0 = k, a1 = Math.min(k + 1, n);
      g += path(arcD(R, a0, a1), {s:k % 2 ? CLR.radL : CLR.rad, sw:12, cap:"butt"});
      if (a1 === k + 1){ const [x0,y0] = P(R - 16, a1), [x1,y1] = P(R + 16, a1); g += ln(x0, y0, x1, y1, {s:CLR.txt, sw:2}); }
      if (a1 - a0 > .6){ const [x,y] = P(R - 44, (a0 + a1) / 2); g += labL(x, y, String(k + 1), 15, {f:CLR.rad, w:800}); } }
    if (S.sEqR){ g += path(arcD(R + 22, 0, 1), {s:CLR.arc, sw:5}); const [x,y] = P(R + 58, .5); g += labL(x, y, "s = r", 16, {f:CLR.arcL, w:800}); }
  }
  /* الأقواس (الدور 2) */
  if (S.arcs > 0) RID.forEach((r, i) => { if (!S.arcShow[i]) return;
    g += path(arcD(r, 0, S.arcs), {s:CLR.arc, sw:7});
    if (S.arcLab){ const [x,y] = P(r + 48, S.arcs / 2), t = (S.arcTxt && S.arcTxt[i]) || ["s₁","s₂","s₃"][i]; g += labL(x, y, t, 17, {f:CLR.arcL, w:800}); } });
  /* المحور */
  g += cir(C.x, C.y, 9, {f:CLR.txt});
  if (S.axis) g += lab(C.x - 64, C.y - 18, T({ar:"المحور", en:"axis"}), 14, {f:CLR.muted});
  /* الراكبون */
  if (S.riders) RID.forEach((r, i) => { const [x,y] = P(r, S.rot);
    if (S.hlRider === i) g += cir(x, y, 38, {s:CLR.gold, sw:3});
    g += cir(x, y, 24, {f:"#e6edf3", s:"#0b1119", sw:3});
    g += tx(x, y + (14 / CK) * .36, String(i + 1), {f:"#0b1119", s:14, w:800});
    if (S.rlab) g += labL(x, y - 46, (i + 1) + " m", 15, {f:CLR.rad}); });
  /* لوحة القياس — في مكان بلا مسمّيات */
  if (S.board){ const lines = Array.isArray(S.board) ? S.board : BOARD[S.board]();
    g += card(1180, 150, 760, lines, {pad:34, s:"#2f5276"}); }
  if (S.overlay === "done") g += card(1180, 190, 760, [
      {t:{ar:"الخلاصة", en:"Summary"}, s:30, c:CLR.gold},
      {t:{ar:"الدوران يُقاس بالزاوية، لا بالمسافة", en:"Rotation is measured by angle, not distance"}, s:24},
      {t:ltr("θ = s / r"), s:34, c:CLR.ang},
      {t:{ar:"راديان واحد: قوس طوله نصف القطر", en:"1 radian: an arc as long as the radius"}, s:22, c:CLR.muted},
      {t:ltr("1 rad ≈ 57.3° · π rad = 180° · 2π rad = 360°"), s:22, c:CLR.radL}], {pad:34, s:CLR.gold});
  return g;
}
function stageHTML(S, camKey){
  const c = CAMS[camKey], k = 1000 / c[2]; CK = k; CAMR = {x:c[0], y:c[1], w:c[2], h:c[2] * .62};
  return SV("0 0 1000 620", `<g transform="scale(${k.toFixed(4)}) translate(${(-c[0]).toFixed(1)},${(-c[1]).toFixed(1)})">` + world(mk(S)) + `</g>`);
}

/* ═══════════════════════════════════════════════════════════════
   3 · نفّذ — مهام مفتوحة كلها بترتيب مقترح، على القرص نفسه
   ═══════════════════════════════════════════════════════════════ */
const DONE = { do:{}, quiz:{} };
function fb(host, kind, html){ let b = host.querySelector(".fb"); if (!b){ b = document.createElement("div"); b.className = "fb"; host.appendChild(b); }
  b.className = "fb show " + kind; b.innerHTML = html; }
function markDone(id){ DONE.do[id] = true; save(); refreshDoNav(); refreshDots(); }
function chooser(opts, onPick){ const d = document.createElement("div"); d.className = "pool";
  d.innerHTML = opts.map((o,i) => `<span class="piece" data-i="${i}">${OT(o)}</span>`).join("");
  d.onclick = e => { const p = e.target.closest(".piece"); if (p) onPick(+p.dataset.i, d); }; return d; }
const box3 = (host, html) => { const b = document.createElement("div"); b.className = "body"; b.innerHTML = html; host.appendChild(b); return b; };
const big = s => `<div style="font-size:1.25rem;font-weight:800;margin:6px 0">${s}</div>`;
const fmtDeg = d => (Math.abs(d - Math.round(d)) < .05 ? String(Math.round(d)) : d.toFixed(1)) + "°";

/* t2 و t3: قيم القطع */
const DEG_TARGETS = [{d:180, a:"π"}, {d:90, a:"π/2"}, {d:360, a:"2π"}, {d:60, a:"π/3"}];
const RAD_PIECES  = [["π/3",60], ["2π",360], ["π/2",90], ["π/4",45], ["π",180], ["3π/2",270]];
const RAD_TARGETS = [{r:"1 rad", a:1, deg:"57.3°"}, {r:"π/6", a:PI/6, deg:"30°"}, {r:"3π/2", a:1.5*PI, deg:"270°"}];
const DEG_PIECES  = [["30°",30], ["90°",90], ["57.3°",57.3], ["180°",180], ["270°",270], ["1°",1]];
/* t4 */
const T4_TH = .5, T4_ANS = ["0.5 m", "1.0 m", "1.5 m"], T4_POOL = ["1.5 m", "0.17 m", "1.0 m", "6.0 m", "0.5 m", "2.0 m"];
/* t6 */

  {t:{ar:"نصف قطر مسار الراكب", en:"the radius of the rider's path"}, same:false,
   why:{ar:"كل راكب على بُعد مختلف من المحور: 1 و2 و3 m.", en:"Each rider is at a different distance from the axis: 1, 2 and 3 m."}},
  {t:{ar:`النسبة ${M("s / r")}`, en:`the ratio ${M("s / r")}`}, same:true,
   why:{ar:`هذه النسبة هي الزاوية نفسها بالراديان، فهي واحدة للجميع.`, en:`This ratio is the angle itself in radians, so it is the same for all.`}},
  {t:{ar:"عدد الدورات التي يكملها الراكب", en:"the number of turns the rider completes"}, same:true,
   why:{ar:"الراكبون يكملون الدورة معاً، لأن القرص يدور كجسم واحد.", en:"The riders complete each turn together, because the disc turns as one body."}}

const TASKS = [
{ id:"t1", title:{ar:"لُفّ الخيوط حول الحافة", en:"Wrap strings round the rim"},
  intro:{ar:"كل خيط طوله يساوي نصف القطر. ضع الخيوط على الحافة واحداً بعد آخر، ثم قدّر ما يلزم لإغلاق الدورة.", en:"Each string is as long as the radius. Lay the strings on the rim one by one, then estimate what closes the turn."},
  build(host, done){ let n = done ? TAU : 0;
    const b = box3(host, `<div class="mini" id="m1"></div><div class="pool"><button class="btn primary" id="t1btn"></button></div><div id="t1q"></div>`);
    const draw = () => { const full = n >= TAU - 1e-6;
      b.querySelector("#m1").innerHTML = stageHTML({radLine:1, strings:n, radEnd:1, wedge:n, wl: full ? "2π rad" : (n ? n + " rad" : ""),
        board:[BL("خيوط على الحافة", "Strings on the rim", 28, CLR.gold), BX(full ? "2π ≈ 6.28" : String(n), 40, CLR.rad),
               BX("θ = " + (full ? "2π rad = 360°" : n + " rad ≈ " + fmtDeg(degOf(n))), 24, CLR.angL)]}, "wide");
      const btn = b.querySelector("#t1btn"); btn.textContent = T({ar:"ضع خيطاً على الحافة", en:"Lay a string on the rim"}); btn.disabled = n >= 6; };
    const ask = () => { const q = b.querySelector("#t1q"); if (q.childElementCount) return;
      q.insertAdjacentHTML("beforeend", `<p style="margin-top:8px"><b>${T({ar:"بقيت فجوة صغيرة. ما الذي يغلق الدورة تماماً؟", en:"A small gap is left. What closes the turn exactly?"})}</b></p>`);
      const W = {0:{ar:"الفجوة أصغر بوضوح من نصف خيط: الدورة 6.28 rad، فالباقي بعد 6 خيوط نحو 0.28 فقط.", en:"The gap is clearly smaller than half a string: a turn is 6.28 rad, so after 6 strings only about 0.28 is left."},
                 2:{ar:`خيط سابع يتجاوز نقطة البداية: ${M("7 rad ≈ 401°")} أكبر من ${M("360°")}.`, en:`A seventh string overshoots the start: ${M("7 rad ≈ 401°")} is more than ${M("360°")}.`},
                 3:{ar:`ستة خيوط تغطي ${M("6 rad ≈ 344°")} فقط، والدورة ${M("360°")}، فالفجوة حقيقية.`, en:`Six strings cover only ${M("6 rad ≈ 344°")}; a turn is ${M("360°")}, so the gap is real.`}};
      q.appendChild(chooser([{ar:"نحو نصف خيط", en:"about half a string"}, {ar:"نحو 0.28 من خيط", en:"about 0.28 of a string"}, {ar:"خيط سابع كامل", en:"a whole seventh string"}, {ar:"لا شيء: اكتملت الدورة", en:"nothing: the turn is complete"}], i => {
        if (i === 1){ n = TAU; draw(); fb(host, "good", T({ar:`صحيح. الدورة تتّسع لـ${M("2π ≈ 6.28")} خيطاً، أي ${M("2π rad = 360°")}، ولذلك المحيط ${M("2πr")}.`, en:`Correct. A turn holds ${M("2π ≈ 6.28")} strings, so ${M("2π rad = 360°")}, which is why the circumference is ${M("2πr")}.`})); markDone("t1"); }
        else fb(host, "bad", T(W[i])); })); };
    b.querySelector("#t1btn").onclick = () => { if (n >= 6) return; n++; draw();
      if (n < 6) fb(host, "hint", T({ar:`الخيط ${M(String(n))}: الزاوية ${M(n + " rad")}. واصل.`, en:`String ${M(String(n))}: the angle is ${M(n + " rad")}. Carry on.`}));
      else { fb(host, "hint", T({ar:"ستة خيوط ولم تكتمل الدورة.", en:"Six strings, and the turn is not complete."})); ask(); } };
    draw(); }},

{ id:"t2", title:{ar:"من الدرجات إلى الراديان", en:"Degrees to radians"},
  intro:{ar:"اقرأ الزاوية بالدرجات على القرص، واختر قيمتها بالراديان. الزوايا تُعرض واحدة بعد أخرى.", en:"Read the angle in degrees on the disc and pick its value in radians. Angles come one at a time."},
  build(host, done){ let k = done ? DEG_TARGETS.length : 0;
    const b = box3(host, `<div class="mini" id="m2"></div><div class="prog" id="p2"></div>`);
    const draw = () => { const i = Math.min(k, DEG_TARGETS.length - 1), t = DEG_TARGETS[i], solved = k > i;
      b.querySelector("#m2").innerHTML = stageHTML({deg:1, wedge:t.d * PI / 180, wl: solved ? t.a : "?",
        board:[BL("حوّل إلى الراديان", "Convert to radians", 28, CLR.gold), BX(t.d + "°", 44, CLR.angL), BX("180° = π rad", 22, CLR.muted)]}, "wide");
      b.querySelector("#p2").innerHTML = T({ar:"أنجزت ", en:"done "}) + `<b class="ltr">${k} / ${DEG_TARGETS.length}</b>`; };
    b.appendChild(chooser(RAD_PIECES.map(p => p[0]), (j, d) => { if (k >= DEG_TARGETS.length) return; const t = DEG_TARGETS[k], [s, v] = RAD_PIECES[j];
      if (s !== t.a) return fb(host, "bad", T({ar:`${M(s)} تساوي ${M(v + "°")}، والمطلوب ${M(t.d + "°")}. اضرب في ${M("π/180")}: ${M(t.d + "° × π/180 = " + t.a)}.`,
                                               en:`${M(s)} is ${M(v + "°")}, but the angle is ${M(t.d + "°")}. Multiply by ${M("π/180")}: ${M(t.d + "° × π/180 = " + t.a)}.`}));
      k++; draw();
      if (k >= DEG_TARGETS.length){ fb(host, "good", T({ar:`أحسنت. كلها من مساواة واحدة: ${M("180° = π rad")}.`, en:`Well done. All from one equality: ${M("180° = π rad")}.`})); markDone("t2"); }
      else fb(host, "hint", T({ar:"صحيح. الزاوية التالية:", en:"Correct. Next angle:"})); }));
    draw(); }},

{ id:"t3", title:{ar:"من الراديان إلى الدرجات", en:"Radians to degrees"},
  intro:{ar:"الزاوية معطاة بالراديان. اختر قيمتها بالدرجات.", en:"The angle is given in radians. Pick its value in degrees."},
  build(host, done){ let k = done ? RAD_TARGETS.length : 0;
    const b = box3(host, `<div class="mini" id="m3"></div><div class="prog" id="p3"></div>`);
    const draw = () => { const i = Math.min(k, RAD_TARGETS.length - 1), t = RAD_TARGETS[i], solved = k > i;
      b.querySelector("#m3").innerHTML = stageHTML({deg: solved ? 1 : 0, wedge:t.a, wl:t.r,
        board:[BL("حوّل إلى الدرجات", "Convert to degrees", 28, CLR.gold), BX(t.r, 44, CLR.angL), BX(solved ? "= " + t.deg : "π rad = 180°", 24, solved ? CLR.gold : CLR.muted)]}, "wide");
      b.querySelector("#p3").innerHTML = T({ar:"أنجزت ", en:"done "}) + `<b class="ltr">${k} / ${RAD_TARGETS.length}</b>`; };
    b.appendChild(chooser(DEG_PIECES.map(p => p[0]), j => { if (k >= RAD_TARGETS.length) return; const t = RAD_TARGETS[k], [s] = DEG_PIECES[j];
      if (s !== t.deg){ const one = s === "1°" ? T({ar:" الراديان ليس درجة واحدة: هو أكبر منها بنحو 57 مرة.", en:" A radian is not one degree: it is about 57 times bigger."}) : "";
        return fb(host, "bad", T({ar:`اضرب في ${M("180/π")}: ${M(t.r + " × 180/π = " + t.deg)}.`, en:`Multiply by ${M("180/π")}: ${M(t.r + " × 180/π = " + t.deg)}.`}) + one); }
      k++; draw();
      if (k >= RAD_TARGETS.length){ fb(host, "good", T({ar:`صحيح. لاحظ أن ${M("1 rad ≈ 57.3°")}، فالزاوية بالراديان عدد صغير مقارنة بالدرجات.`, en:`Correct. Note ${M("1 rad ≈ 57.3°")}: radian values are small numbers compared with degrees.`})); markDone("t3"); }
      else fb(host, "hint", T({ar:"صحيح. التالية:", en:"Correct. Next:"})); }));
    draw(); }},

{ id:"t4", title:{ar:"قِس قوس كل راكب", en:"Measure each rider's arc"},
  intro:{ar:`دار القرص ${M("θ = 0.5 rad")}. احسب طول القوس الذي قطعه كل راكب بدءاً من الداخلي. الراكب النشط محاط بحلقة ذهبية.`, en:`The disc turned ${M("θ = 0.5 rad")}. Find the arc each rider travelled, starting with the inner one. The active rider has a gold ring.`},

        arcShow:[k > 0, k > 1, k > 2], arcTxt:["s₁ = " + T4_ANS[0], "s₂ = " + T4_ANS[1], "s₃ = " + T4_ANS[2]], hlRider: k < 3 ? k : -1}, "arcs");

let STAGE = "read", STEP = 0, PLAYING = null, SPEED = 1, TASK_I = 0;

const KEY = "rot.s1.radian.v1";

function renderNav(){
  $("#stageNav").innerHTML = UI.stages.map(s => `<button data-k="${s.k}" class="${STAGE===s.k?'active':''}"><span class="dot"></span><span class="ic">${s.ic}</span><span class="t">${T(s.t)}</span></button>`).join("");

function refreshDots(){ const map = {watch: STEP >= STEPS.length-1, do: TASKS.every(t => DONE.do[t.id]), read: false, test: Object.keys(DONE.quiz).length >= QUIZ.length};
  $$("#stageNav button").forEach(b => b.classList.toggle("done", !!map[b.dataset.k])); }

/* شاهد */
function renderActs(){ const cur = STEPS[STEP].act;
  $("#actChips").innerHTML = ACTS.map((a,i) => `<button class="act ${i===cur?'active':(i<cur?'past':'')}" data-i="${i}"><span class="n">${i+1}</span>${T(a.t)}</button>`).join("");
  $$("#actChips .act").forEach(c => c.onclick = () => { stopPlay(); STEP = ACTS[+c.dataset.i].from; drawStep(); }); }
function renderRoleBar(){ const who = STEPS[STEP].who || {};
  $("#roleBar").innerHTML = ROLES.map(r => { const on = !!who[r.k];
    return `<div class="role ${on?'on':''}" style="color:${r.col}"><div class="hd"><span class="gl"></span><span class="nm">${T(r.nm)}</span><span class="job">· ${T(r.job)}</span></div>
      <div class="idle">${T(r.idle)}</div><div class="now">${on ? T(who[r.k]) : ""}</div></div>`; }).join(""); }
function drawStep(){ const st = STEPS[STEP];
  $("#sceneSvg").innerHTML = stageHTML(st.s, st.cam); $("#locBadge").textContent = T(LOC[st.cam]); $("#sceneCap").innerHTML = T(st.cap);
  $("#stepLbl").innerHTML = '<span class="ltr">' + (STEP+1) + " / " + STEPS.length + "</span>"; $("#stepBar").style.width = ((STEP+1)/STEPS.length*100) + "%";
  $("#btnPrev").disabled = STEP === 0; $("#btnNext").disabled = STEP === STEPS.length-1; renderActs(); renderRoleBar(); refreshDots(); }
function renderWatch(){ $("#sceneTitle").textContent = T(UI.journey); $("#btnPrev").textContent = T(UI.prev); $("#btnNext").textContent = T(UI.next);
  $("#btnPlay").innerHTML = (PLAYING ? "❚❚ " + T(UI.pause) : "▶ " + T(UI.play)); $("#spdLbl").textContent = T(UI.speed); $("#spdSel").value = String(SPEED); drawStep(); }
function stopPlay(){ if (PLAYING){ clearInterval(PLAYING); PLAYING = null; const b = $("#btnPlay"); if (b) b.innerHTML = "▶ " + T(UI.play); } }
function tick(){ if (STEP < STEPS.length-1){ STEP++; drawStep(); } else stopPlay(); }
function wireWatch(){
  $("#btnPrev").onclick = () => { stopPlay(); if (STEP > 0){ STEP--; drawStep(); } };
  $("#btnNext").onclick = () => { stopPlay(); if (STEP < STEPS.length-1){ STEP++; drawStep(); } };
  $("#btnPlay").onclick = () => { if (PLAYING) return stopPlay(); if (STEP >= STEPS.length-1) STEP = 0; drawStep();
    $("#btnPlay").innerHTML = "❚❚ " + T(UI.pause); PLAYING = setInterval(tick, stepMs()); };
  $("#spdSel").onchange = e => { SPEED = parseFloat(e.target.value) || 1; save(); if (PLAYING){ clearInterval(PLAYING); PLAYING = setInterval(tick, stepMs()); } }; }

function renderDo(){ const w = $("#doWrap"); w.innerHTML = ""; TASK_I = Math.max(0, Math.min(TASKS.length - 1, TASK_I));
  w.insertAdjacentHTML("beforeend", `<div class="tnav" id="taskNav">${TASKS.map((t,i) => `<button class="tchip" data-i="${i}"><span class="n">${i+1}</span><span>${T(t.title)}</span></button>`).join("")}</div>`);
  const t = TASKS[TASK_I], c = document.createElement("div"); c.className = "card task"; c.dataset.id = t.id;
  c.innerHTML = `<h3><span class="tag ltr">${TASK_I+1} / ${TASKS.length}</span>${T(t.title)}<span class="tag ok donetag">✓ ${T(UI.done)}</span></h3><p style="font-size:.9rem;color:var(--muted)">${T(t.intro)}</p>`;
  w.appendChild(c); t.build(c, !!DONE.do[t.id]);
  w.insertAdjacentHTML("beforeend", `<div class="tfoot"><button class="btn" id="tPrev">${T(UI.tPrev)}</button><span class="cnt" id="tCnt"></span><button class="btn primary" id="tNext">${T(UI.tNext)}</button></div>`);
  const go = i => { TASK_I = i; renderDo(); const n = $("#taskNav"); if (n && n.scrollIntoView) n.scrollIntoView({block:"nearest", behavior:"smooth"}); };
  $$("#taskNav .tchip").forEach(b => b.onclick = () => go(+b.dataset.i));

  const tg = $("#doWrap .donetag"); if (tg) tg.style.display = DONE.do[TASKS[TASK_I].id] ? "" : "none";
  const cn = $("#tCnt"); if (cn) cn.innerHTML = T(UI.tCount).replace("{d}", `<b class="ltr">${d}</b>`).replace("{n}", `<b class="ltr">${TASKS.length}</b>`);
  const p = $("#tPrev"), n = $("#tNext"); if (p) p.disabled = TASK_I === 0; if (n) n.disabled = TASK_I === TASKS.length - 1; }

function shuffled(n, seed){ let s = 0; for (const ch of seed) s = (s*31 + ch.charCodeAt(0)) >>> 0; const a = [...Array(n).keys()];
  for (let i = n-1; i > 0; i--){ s = (s*1103515245 + 12345) >>> 0; const j = s % (i+1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function correctText(q){ const o = i => OT(q.opts[i]);
  if (q.type === "mcq" || q.type === "odd") return o(q.ans); if (q.type === "multi") return q.ans.map(o).join(" · ");
  if (q.type === "tf") return T(q.ans ? UI.tru : UI.fls); if (q.type === "match") return q.pairs.map(p => `${OT(p[0])} ← ${OT(p[1])}`).join("<br>"); return ""; }
function expHTML(q, st){ const body = st.ok ? T(q.ok) : ((q.w && q.w[st.pick] != null ? T(q.w[st.pick]) + " " : "") + T(q.bad || q.ok));
  return `<div class="exp ${st.ok?'good':'bad'}">${st.ok?"✔ ":"✘ "}${body}${!st.ok ? `<div style="margin-top:7px;padding-top:7px;border-top:1px dashed #ffffff22"><b>${T(UI.correctIs)}:</b> ${correctText(q)}</div>` : ""}
    <div class="nud">${T(UI.train)}: ${T(q.nudge)}</div></div>`; }
function commitQ(i, res){ DONE.quiz[i] = res; save(); renderQuiz(); const e = $(`.q[data-i="${i}"]`); if (e) e.scrollIntoView({block:"nearest", behavior:"smooth"}); }
function uiChoice(q, i, a, st){ a.innerHTML = `<ul class="opts">${q.opts.map((o,j) => { let c = ""; if (st){ if (j === q.ans) c = "correct"; else if (j === st.pick) c = "miss"; }
    return `<li class="${c}" data-j="${j}"><span class="k">${"ABCDE"[j]}</span><span>${OT(o)}</span></li>`; }).join("")}</ul>`;
  if (!st) a.querySelectorAll("li").forEach(li => li.onclick = () => commitQ(i, {pick:+li.dataset.j, ok:+li.dataset.j === q.ans})); }
function uiTiles(q, i, a, st){ a.innerHTML = `<div class="tiles">${q.opts.map((o,j) => { let c = ""; if (st){ if (j === q.ans) c = "correct"; else if (j === st.pick) c = "miss"; }
    return `<div class="tile ${c}" data-j="${j}">${OT(o)}</div>`; }).join("")}</div>`;
  if (!st) a.querySelectorAll(".tile").forEach(t => t.onclick = () => commitQ(i, {pick:+t.dataset.j, ok:+t.dataset.j === q.ans})); }
function uiTF(q, i, a, st){ const mk = (v, lbl) => { let c = ""; if (st){ if (v === q.ans) c = "correct"; else if (v === st.pick) c = "miss"; }
    return `<button class="tfbtn ${c}" data-v="${v}">${v ? "✔ " : "✘ "}${T(lbl)}</button>`; };
  a.innerHTML = `<div class="tfrow">${mk(true, UI.tru)}${mk(false, UI.fls)}</div>`;
  if (!st) a.querySelectorAll(".tfbtn").forEach(b => b.onclick = () => { const v = b.dataset.v === "true"; commitQ(i, {pick:v, ok:v === q.ans}); }); }
function uiMulti(q, i, a, st){ const picked = new Set(st ? st.pick : []);
  a.innerHTML = `<ul class="opts">${q.opts.map((o,j) => { let c = picked.has(j) ? "sel" : ""; if (st){ const isA = q.ans.includes(j), was = picked.has(j); c = isA && was ? "correct" : (!isA && was ? "miss" : (isA && !was ? "missed" : "")); }
    return `<li class="${c}" data-j="${j}"><span class="k">${picked.has(j) ? "✓" : ""}</span><span>${OT(o)}</span></li>`; }).join("")}</ul>${st ? "" : `<div class="actions"><button class="btn primary" id="chk${i}" disabled>${T(UI.check)}</button></div>`}`;
  if (st) return; const chk = a.querySelector("#chk"+i);
  a.querySelectorAll("li").forEach(li => li.onclick = () => { const j = +li.dataset.j; picked.has(j) ? picked.delete(j) : picked.add(j); li.classList.toggle("sel", picked.has(j)); li.querySelector(".k").textContent = picked.has(j) ? "✓" : ""; chk.disabled = !picked.size; });
  chk.onclick = () => { const pick = [...picked].sort((x,y)=>x-y); commitQ(i, {pick, ok: pick.length === q.ans.length && pick.every(j => q.ans.includes(j))}); }; }
function uiMatch(q, i, a, st){ const n = q.pairs.length, order = shuffled(n, "q"+i), pairing = st ? st.pick.slice() : Array(n).fill(null); let selL = null; const L = "ABCDE";
  const draw = () => {
    const left = q.pairs.map((p,k) => { let c = ""; if (st) c = pairing[k] === k ? "correct" : "miss"; else if (selL === k) c = "sel"; const r = pairing[k];
      return `<div class="mitem ${c} ${r!=null?'paired':''}" data-l="${k}"><span class="n">${r != null ? L[order.indexOf(r)] : "•"}</span><span>${OT(p[0])}</span></div>`; }).join("");
    const right = order.map((ri, k) => { const by = pairing.indexOf(ri); let c = ""; if (st) c = by === ri ? "correct" : (by >= 0 ? "miss" : "");
      return `<div class="mitem ${c} ${by>=0?'paired':''}" data-r="${ri}"><span class="n">${L[k]}</span><span>${OT(q.pairs[ri][1])}</span></div>`; }).join("");
    a.innerHTML = `<div class="match"><div class="mcol">${left}</div><div class="mlink">⟷</div><div class="mcol">${right}</div></div>${st ? "" : `<div class="actions"><button class="btn primary" id="chk${i}" ${pairing.every(v=>v!=null)?'':'disabled'}>${T(UI.check)}</button></div>`}`;
    if (st) return;
    a.querySelectorAll("[data-l]").forEach(e => e.onclick = () => { selL = +e.dataset.l; draw(); });
    a.querySelectorAll("[data-r]").forEach(e => e.onclick = () => { if (selL == null) return; const ri = +e.dataset.r; const prev = pairing.indexOf(ri); if (prev >= 0) pairing[prev] = null; pairing[selL] = ri; selL = null; draw(); });
    a.querySelector("#chk"+i).onclick = () => commitQ(i, {pick: pairing.slice(), ok: pairing.every((r,k) => r === k)}); };
  draw(); }
function renderQuiz(){ const w = $("#quizWrap"); w.innerHTML = "";
  QUIZ.forEach((q,i) => { const st = DONE.quiz[i]; const d = document.createElement("div"); d.className = "q" + (st ? (st.ok ? " done right" : " done wrong") : ""); d.dataset.i = i;
    d.innerHTML = `<div class="qh"><div class="num">${i+1}</div><div class="stem">${T(q.stem)}</div></div><div class="qmeta"><span class="tag">${T(UI.skill)}: ${T(SK[q.sk])}</span></div><div class="ans"></div>`;
    w.appendChild(d); ({mcq:uiChoice, odd:uiTiles, tf:uiTF, multi:uiMulti, match:uiMatch})[q.type](q, i, d.querySelector(".ans"), st);
    if (st) d.insertAdjacentHTML("beforeend", expHTML(q, st)); });
  renderScore(); }
function renderScore(){ const ans = Object.keys(DONE.quiz).length, right = Object.values(DONE.quiz).filter(v => v.ok).length, pct = ans ? Math.round(right/ans*100) : 0; const per = {};
  QUIZ.forEach((q,i) => { per[q.sk] = per[q.sk] || {n:0, r:0}; if (DONE.quiz[i] != null){ per[q.sk].n++; if (DONE.quiz[i].ok) per[q.sk].r++; } });
  const col = v => v>=80?'var(--ok)':v>=50?'var(--warn)':'var(--bad)';
  $("#scoreBox").innerHTML = `<div><div class="big ltr" style="color:${col(pct)}">${right} / ${QUIZ.length}</div><div class="lbl">${T(UI.score)} · <span class="ltr">${ans}</span> ${T(UI.answered)}</div></div>
    <div class="skillbars"><div class="lbl" style="margin-bottom:2px">${T(UI.bySkill)}</div>${Object.keys(SK).map(k => { const p = per[k] || {n:0, r:0}, v = p.n ? Math.round(p.r/p.n*100) : 0;
      return `<div class="sb"><span class="nm">${T(SK[k])}</span><span class="tr"><i style="width:${v}%;background:${col(v)}"></i></span><span class="ltr" style="flex:0 0 44px;text-align:end;color:var(--muted)">${p.r}/${p.n}</span></div>`; }).join("")}</div>`;
  refreshDots(); }

/* الكل */
function renderAll(){
  document.documentElement.lang = LANG; document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr"; document.body.dir = document.documentElement.dir;
  $("#hTitle").textContent = T(UI.title); $("#hSub").textContent = T(UI.sub); $("#langBtn").textContent = LANG === "ar" ? "English" : "العربية";
  $("#resetBtn").textContent = T(UI.reset); $("#foot").innerHTML = T(UI.foot);
  renderNav(); showPane();
  if (STAGE === "read") renderRead(); if (STAGE === "watch") renderWatch(); if (STAGE === "do") renderDo(); if (STAGE === "test") renderQuiz(); }
function applyLang(){ try{ renderAll(); }catch(e){} }          /* المنصّة تستدعيها بعد تبديل اللغة */
$("#langBtn").onclick = () => { LANG = LANG === "ar" ? "en" : "ar"; stopPlay(); renderAll(); };
$("#resetBtn").onclick = () => { DONE.do = {}; DONE.quiz = {}; SPEED = 1; save(); STEP = 0; TASK_I = 0; stopPlay(); renderAll(); };
wireWatch(); load(); renderAll();
</script>
