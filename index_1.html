<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عماد فريج · أدوات الذكاء الاصطناعي للتعليم</title>
<meta name="description" content="دليل منتقى لنحو 300 أداة ذكاء اصطناعي للمعلمين والباحثين وواضعي الاختبارات — عماد فريج">
<meta name="theme-color" content="#04050d">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:url" content="https://emadfraij.github.io/">
<meta property="og:title" content="عماد فريج · دليل أدوات الذكاء الاصطناعي للتعليم">
<meta property="og:description" content="نحو 300 أداة منتقاة للمعلمين والباحثين وواضعي الاختبارات، بالعربية والإنجليزية.">
<meta property="og:image" content="https://emadfraij.github.io/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://emadfraij.github.io/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04050d; --panel:#0a0c1c; --text:#e8ecff; --muted:#8a93b8; --soft:#b9c1e6;
  --cyan:#00f0ff; --pink:#ff2bd6; --lime:#b6ff3b; --violet:#8b5cf6;
  --glass:rgba(255,255,255,.04); --line:rgba(255,255,255,.09); --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;overflow-x:clip;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}

.bars{position:fixed;inset:0;z-index:200;pointer-events:none}
.bars::before,.bars::after{content:"";position:absolute;left:0;right:0;height:50%;background:#000;transition:transform 1.4s cubic-bezier(.77,0,.18,1) .2s}
.bars::before{top:0}.bars::after{bottom:0}
body.ready .bars::before{transform:translateY(-100%)}
body.ready .bars::after{transform:translateY(100%)}

#net{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(90px);opacity:.55}
.aurora span{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:drift 22s ease-in-out infinite alternate}
.aurora span:nth-child(1){width:45vw;height:45vw;background:var(--cyan);top:5%;right:10%;opacity:.22}
.aurora span:nth-child(2){width:40vw;height:40vw;background:var(--pink);top:40%;left:0;opacity:.2;animation-duration:28s}
.aurora span:nth-child(3){width:35vw;height:35vw;background:var(--violet);bottom:0;right:35%;opacity:.22;animation-duration:34s}
@keyframes drift{to{transform:translate(8vw,-6vh) scale(1.15)}}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.06;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.5) 0 1px,transparent 1px 3px)}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%)}
header,main,section,footer,nav,.marquee{position:relative;z-index:2}

.topbar{position:fixed;top:0;left:0;right:0;z-index:60;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
.topbar.solid{background:rgba(4,5,13,.75);backdrop-filter:blur(16px);border-color:var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}
.brand .mono{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:.9rem;color:#04050d;
  background:linear-gradient(135deg,var(--cyan),var(--violet),var(--pink));box-shadow:0 0 18px rgba(0,240,255,.45)}
.spacer{flex:1}
.kbtn{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--muted);cursor:pointer;transition:.25s;font-size:.9rem}
.kbtn:hover{border-color:var(--cyan);color:var(--text);box-shadow:0 0 18px rgba(0,240,255,.25)}
.kbtn kbd{font:inherit;font-size:.72rem;padding:2px 7px;border-radius:6px;border:1px solid var(--line);direction:ltr}
.lang{display:flex;padding:4px;border-radius:99px;background:rgba(10,12,28,.7);border:1px solid var(--line)}
.lang button{font-size:.8rem;font-weight:600;padding:6px 12px;border:0;border-radius:99px;cursor:pointer;color:var(--muted);background:transparent;transition:.25s}
.lang button.on{color:#04050d;background:var(--cyan);box-shadow:0 0 16px rgba(0,240,255,.6)}

.hero{min-height:100vh;display:grid;place-items:center;text-align:center;padding:110px 20px 70px}
.hero-inner{will-change:transform,opacity}
.avatar{position:relative;width:170px;height:170px;margin:0 auto 26px;border-radius:50%;padding:5px}
.avatar::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from var(--a,0deg),var(--cyan),var(--violet),var(--pink),var(--lime),var(--cyan));animation:spin 5s linear infinite}
.avatar::after{content:"";position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(circle,rgba(0,240,255,.35),transparent 65%);z-index:-1;animation:pulse 3s ease-in-out infinite}
.avatar .face{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:#0a0c1c;display:grid;place-items:center;
  font-size:3rem;font-weight:700;color:var(--cyan);text-shadow:0 0 18px rgba(0,240,255,.8);border:3px solid #04050d}
.avatar img{width:100%;height:100%;object-fit:cover;transform:scale(1.04)}
body .hero .avatar{opacity:0;transform:scale(.8)}
body.ready .hero .avatar{animation:popin 1s cubic-bezier(.2,.9,.2,1.2) .6s forwards}
@keyframes popin{to{opacity:1;transform:scale(1)}}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
@keyframes pulse{50%{opacity:.4;transform:scale(1.08)}}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border:1px solid rgba(0,240,255,.35);border-radius:99px;font-size:.85rem;color:var(--cyan);background:rgba(0,240,255,.06);backdrop-filter:blur(8px)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px var(--lime);animation:blink2 1.6s infinite}
@keyframes blink2{50%{opacity:.3}}
.hero h1{font-size:clamp(3rem,10vw,7.5rem);font-weight:700;line-height:1.1;margin:22px 0 8px;padding:0 .1em .15em;letter-spacing:-1px;
  background:linear-gradient(100deg,var(--cyan),var(--violet) 35%,var(--pink) 65%,var(--lime));background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 9s linear infinite;
  filter:drop-shadow(0 0 30px rgba(0,240,255,.35));clip-path:inset(0 0 100% 0)}
body.ready .hero h1{animation:flow 9s linear infinite,reveal 1.2s cubic-bezier(.77,0,.18,1) .9s forwards}
@keyframes flow{to{background-position:300% 0}}
@keyframes reveal{to{clip-path:inset(0 0 0 0)}}
.scanline{height:2px;width:min(520px,70vw);margin:0 auto;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 18px var(--cyan);opacity:0}
body.ready .scanline{animation:scan 1.4s ease .8s forwards}
@keyframes scan{0%{opacity:0;transform:scaleX(0)}40%{opacity:1;transform:scaleX(1)}100%{opacity:.35;transform:scaleX(1)}}
.role{font-size:clamp(1rem,2.2vw,1.3rem);color:var(--muted);min-height:2em;margin-top:22px}
.role .cursor{display:inline-block;width:2px;height:1.1em;background:var(--cyan);vertical-align:middle;margin-inline-start:3px;box-shadow:0 0 10px var(--cyan);animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.intro{max-width:800px;margin:14px auto 0;color:var(--soft);font-size:1.08rem}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 24px;border-radius:14px;font-weight:600;cursor:pointer;transition:.25s;border:1px solid var(--line)}
.btn.primary{color:#04050d;background:linear-gradient(135deg,var(--cyan),#6ee7ff);border:0;box-shadow:0 0 30px rgba(0,240,255,.45)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 0 44px rgba(0,240,255,.7)}
.btn.ghost{background:var(--glass)}
.btn.ghost:hover{border-color:var(--pink);box-shadow:0 0 24px rgba(255,43,214,.35)}
.btn svg{width:18px;height:18px;fill:currentColor}
.stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:36px}
.stat{min-width:130px;padding:14px 20px;border-radius:var(--radius);background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px)}
.stat b{display:block;font-size:1.9rem;font-weight:700;color:var(--cyan);text-shadow:0 0 18px rgba(0,240,255,.6)}
.stat:nth-child(2) b{color:var(--pink);text-shadow:0 0 18px rgba(255,43,214,.6)}
.stat:nth-child(3) b{color:var(--lime);text-shadow:0 0 18px rgba(182,255,59,.6)}
.stat span{font-size:.85rem;color:var(--muted)}

.marquee{direction:ltr;padding:22px 0;border-block:1px solid var(--line);background:rgba(10,12,28,.45);backdrop-filter:blur(8px);overflow:hidden;
  -webkit-mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.track{display:flex;gap:14px;width:max-content;animation:slide 70s linear infinite;direction:ltr}
.track.rev{animation-direction:reverse;margin-top:12px;animation-duration:85s}
.hm{width:100vw;margin:22px calc(50% - 50vw) 8px}
.marquee:hover .track{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-50%)}}
.logo{display:flex;align-items:center;gap:10px;padding:9px 15px;border-radius:14px;border:1px solid var(--line);background:var(--glass);white-space:nowrap;font-size:.9rem;color:var(--soft);transition:.25s}
.logo:hover{border-color:var(--cyan);color:var(--text)}
.logo img{width:22px;height:22px;border-radius:6px}

.sec{padding-top:90px;padding-bottom:20px}
.eyebrow{color:var(--cyan);font-size:.85rem;font-weight:600;letter-spacing:.5px}
.sec h2{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:700;line-height:1.25;margin:6px 0 10px}
.sec .lead{color:var(--muted);max-width:640px}

.rail{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:26px 2px 18px;scrollbar-width:thin;scrollbar-color:var(--violet) transparent}
.feat{flex:none;width:min(360px,82vw);scroll-snap-align:start;position:relative;padding:26px;border-radius:24px;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,43,214,.12),rgba(0,240,255,.05) 60%,rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);transition:.3s}
.feat::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
  background:conic-gradient(from var(--a,0deg),var(--cyan),var(--pink),var(--lime),var(--cyan));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 6s linear infinite;opacity:.8}
.feat:hover{transform:translateY(-6px);box-shadow:0 30px 60px -25px rgba(255,43,214,.5)}
.feat .big{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid var(--line);margin-bottom:18px}
.feat .big img{width:38px;height:38px}
.feat h3{font-size:1.5rem;direction:ltr;text-align:start;unicode-bidi:plaintext}
.feat p{color:var(--soft);margin:8px 0 18px;min-height:3.4em}

.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-top:28px}
.dom{grid-column:span 2;position:relative;padding:24px;border-radius:22px;border:1px solid var(--line);cursor:pointer;overflow:hidden;text-align:start;
  background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01));transition:.3s;min-height:170px;display:flex;flex-direction:column}
.dom:nth-child(4),.dom:nth-child(5){grid-column:span 3}
.dom::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;inset-inline-end:-60px;top:-80px;filter:blur(40px);opacity:.35;background:var(--c,var(--cyan));transition:.4s}
.dom:hover{border-color:var(--c,var(--cyan));transform:translateY(-4px)}
.dom:hover::before{opacity:.6}
.dom .n{font-size:2.4rem;font-weight:700;color:var(--c,var(--cyan));line-height:1;position:relative}
.dom h3{font-size:1.3rem;margin:10px 0 6px;position:relative}
.dom small{color:var(--muted);font-size:.85rem;line-height:1.6;position:relative}

.dir{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:start;margin-top:28px}
.side{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow-y:auto;padding:16px;border-radius:20px;border:1px solid var(--line);
  background:rgba(10,12,28,.65);backdrop-filter:blur(14px);scrollbar-width:thin;scrollbar-color:var(--violet) transparent}
.search{position:relative;margin-bottom:12px}
.search input{width:100%;padding-block:11px;padding-inline:40px 12px;font:inherit;font-size:.95rem;color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;outline:none;transition:.25s}
.search input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,240,255,.15)}
.search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted)}
.prices{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pf{flex:1;padding:6px 8px;border-radius:99px;font-size:.8rem;cursor:pointer;color:var(--muted);background:transparent;border:1px solid var(--line);transition:.25s;white-space:nowrap}
.pf.on{color:#04050d;background:var(--lime);border-color:var(--lime);box-shadow:0 0 14px rgba(182,255,59,.5);font-weight:600}
.navall,.dn,.cn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:start;border:0;background:transparent;cursor:pointer;border-radius:10px;transition:.2s}
.navall,.dn{padding:9px 10px;font-weight:600;font-size:.95rem}
.cn{padding:6px 10px;padding-inline-start:22px;font-size:.87rem;color:var(--muted)}
.navall:hover,.dn:hover,.cn:hover{background:rgba(255,255,255,.05);color:var(--text)}
.navall.on,.dn.on,.cn.on{background:rgba(0,240,255,.12);color:var(--cyan)}
.dn em,.cn em,.navall em{font-style:normal;font-size:.75rem;color:var(--muted);font-weight:400}
.dg{border-top:1px solid var(--line);padding-top:4px;margin-top:4px}
.dg .cats{display:none}
.dg.open .cats{display:block}
.reset{display:none;margin-top:10px;width:100%;padding:8px;border-radius:10px;border:1px dashed var(--pink);background:transparent;color:var(--pink);cursor:pointer;font-size:.85rem}
.reset.show{display:block}
.status{color:var(--muted);font-size:.9rem;margin-bottom:6px;min-height:1.5em}
.mob{display:none}
.dir>div{min-width:0}

section.cat{padding:22px 0 18px}
.cat h3{font-size:1.35rem;font-weight:600;display:flex;align-items:center;gap:12px;margin-bottom:16px}
.cat h3::before{content:"";width:6px;height:24px;border-radius:3px;background:linear-gradient(var(--cyan),var(--pink));box-shadow:0 0 14px var(--cyan)}
.cat h3 small{font-size:.8rem;color:var(--muted);font-weight:400}
.cat h3::after{content:"";flex:1;height:1px;background:linear-gradient(to left,var(--line),transparent)}
[dir=ltr] .cat h3::after{background:linear-gradient(to right,var(--line),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{--mx:50%;--my:50%;position:relative;display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:var(--radius);
  background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015));border:1px solid var(--line);overflow:hidden;
  transition:transform .25s,border-color .3s,box-shadow .3s;opacity:0;translate:0 22px}
.card.in{opacity:1;translate:0 0;transition:opacity .6s ease,translate .6s cubic-bezier(.2,.8,.2,1),transform .25s,border-color .3s,box-shadow .3s}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(300px circle at var(--mx) var(--my),rgba(0,240,255,.16),transparent 45%)}
.card:hover{border-color:rgba(0,240,255,.45);box-shadow:0 18px 50px -20px rgba(0,240,255,.45)}
.card:hover::before{opacity:1}
.top{display:flex;align-items:center;gap:12px}
.ico{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;font-weight:700;color:var(--cyan);background:rgba(255,255,255,.06);border:1px solid var(--line);overflow:hidden}
.ico img{width:26px;height:26px}
.name{font-weight:600;font-size:1.05rem;direction:ltr;text-align:start;unicode-bidi:plaintext;line-height:1.3}
.host{font-size:.75rem;color:var(--muted);direction:ltr;text-align:start;unicode-bidi:plaintext}
.note{font-size:.9rem;color:var(--soft);flex:1}
.bottom{display:flex;justify-content:space-between;align-items:center}
.tag{font-size:.75rem;padding:3px 10px;border-radius:99px;border:1px solid}
.tag.free{color:var(--lime);border-color:rgba(182,255,59,.4);background:rgba(182,255,59,.08)}
.tag.freemium{color:var(--cyan);border-color:rgba(0,240,255,.4);background:rgba(0,240,255,.08)}
.tag.paid{color:var(--pink);border-color:rgba(255,43,214,.4);background:rgba(255,43,214,.08)}
.go{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:4px;transition:.25s}
.go .arr{display:inline-block}
[dir=ltr] .go .arr{transform:scaleX(-1)}
.card:hover .go{color:var(--cyan);gap:8px}
.empty{text-align:center;color:var(--muted);padding:60px 0;display:none}

footer{margin-top:90px;padding:40px 0;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:.9rem}

.pal{position:fixed;inset:0;z-index:150;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:rgba(2,3,8,.6);backdrop-filter:blur(6px)}
.pal.open{display:flex}
.palbox{width:min(640px,100%);border-radius:20px;border:1px solid rgba(0,240,255,.35);background:rgba(10,12,28,.96);box-shadow:0 0 60px rgba(0,240,255,.25),0 30px 80px rgba(0,0,0,.6);overflow:hidden;animation:pop .2s ease}
@keyframes pop{from{transform:translateY(-10px) scale(.98);opacity:0}}
.palbox input{width:100%;padding:18px 20px;font:inherit;font-size:1.1rem;color:var(--text);background:transparent;border:0;border-bottom:1px solid var(--line);outline:none}
.res{max-height:55vh;overflow-y:auto}
.ri{display:flex;align-items:center;gap:12px;padding:11px 18px;cursor:pointer;border-inline-start:3px solid transparent}
.ri img{width:22px;height:22px;border-radius:6px}
.ri .rn{font-weight:600;direction:ltr;unicode-bidi:plaintext}
.ri .rc{font-size:.8rem;color:var(--muted)}
.ri.act{background:rgba(0,240,255,.1);border-color:var(--cyan)}
.palfoot{display:flex;gap:16px;padding:10px 18px;font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);direction:ltr}

.totop{position:fixed;bottom:20px;inset-inline-start:20px;z-index:50;width:48px;height:48px;border-radius:50%;border:1px solid var(--cyan);
  background:rgba(10,12,28,.85);color:var(--cyan);font-size:1.3rem;cursor:pointer;box-shadow:0 0 18px rgba(0,240,255,.45);opacity:0;pointer-events:none;transition:.3s}
.totop.show{opacity:1;pointer-events:auto}
.rv{opacity:0;transform:translateY(30px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}

@media (max-width:980px){
  .dir{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mob{display:block;position:sticky;top:64px;z-index:40;background:rgba(4,5,13,.88);backdrop-filter:blur(14px);margin:0 -20px;padding:10px 20px;border-bottom:1px solid var(--line)}
  .mob .row{display:flex;gap:8px}
  .mob select,.mob input{flex:1;min-width:0;width:0;padding:10px 12px;font:inherit;font-size:.92rem;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;outline:none}
  .mob select option,.mob select optgroup{background:#0a0c1c}
  .mob .prices{margin:8px 0 0}
  .bento{grid-template-columns:1fr 1fr}
  .dom,.dom:nth-child(4){grid-column:span 1}
  .dom:nth-child(5){grid-column:span 2}
  .kbtn span{display:none}
}
@media (max-width:600px){
  .grid{grid-template-columns:1fr}
  .brand .full{display:none}
  .avatar{width:136px;height:136px}
  .kbtn kbd{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .card,.rv{opacity:1;translate:0 0;transform:none}
  .hero h1{clip-path:none}
  body .hero .avatar{opacity:1;transform:none}
  #net{display:none}
}
</style>
</head>
<body>
<div class="bars"></div>
<canvas id="net"></canvas>
<div class="aurora"><span></span><span></span><span></span></div>
<div class="grain"></div>
<div class="vignette"></div>

<nav class="topbar" id="topbar">
  <div class="wrap">
    <span class="spacer"></span>
    <button class="kbtn" id="kbtn" aria-label="Search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span data-i18n="quick">بحث سريع</span><kbd>Ctrl K</kbd></button>
    <div class="lang" role="group" aria-label="Language"><button data-lang="ar">ع</button><button data-lang="en">EN</button></div>
  </div>
</nav>

<header class="hero" id="hero">
  <div class="hero-inner" id="heroInner">
    <div class="avatar"><div class="face" id="face"></div></div>
    <span class="chip"><i></i><span id="chipName"></span></span>
    <p class="role"><span id="typed"></span><span class="cursor"></span></p>
    <div class="marquee hm" aria-hidden="true"><div class="track" id="t1"></div><div class="track rev" id="t2"></div></div>
    <p class="intro" id="intro"></p>
    <div class="cta">
      <a class="btn primary" href="#directory"><span data-i18n="explore">استكشف الأدوات</span></a>
    </div>
    <div class="stats">
      <div class="stat"><b data-count="tools">0</b><span data-i18n="sTools">أداة منتقاة</span></div>
      <div class="stat"><b data-count="cats">0</b><span data-i18n="sCats">قسماً</span></div>
      <div class="stat"><b data-count="free">0</b><span data-i18n="sFree">مجانية بالكامل</span></div>
    </div>
  </div>
</header>


<section class="wrap sec rv" id="picks">
  <div class="eyebrow" data-i18n="e1">مختارات</div>
  <h2 data-i18n="h1">اختياراتي الأولى</h2>
  <p class="lead" data-i18n="l1">الأدوات التي أستخدمها يومياً وأنصح بها قبل غيرها.</p>
  <div class="rail" id="rail"></div>
</section>

<section class="wrap sec rv" id="domains">
  <div class="eyebrow" data-i18n="e2">المجالات</div>
  <h2 data-i18n="h2">ابدأ من حاجتك</h2>
  <p class="lead" data-i18n="l2">اختر مجالاً لتنتقل مباشرة إلى أدواته.</p>
  <div class="bento" id="bento"></div>
</section>

<section class="wrap sec" id="directory">
  <div class="eyebrow" data-i18n="e3">الدليل الكامل</div>
  <h2 data-i18n="h3">كل الأدوات</h2>
  <div class="dir">
    <aside class="side" id="side">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" autocomplete="off"></div>
      <div class="prices" id="prices"></div>
      <div id="tree"></div>
      <button class="reset" id="reset" data-i18n="reset">إلغاء كل التصفيات</button>
    </aside>
    <div>
      <div class="mob" id="mob">
        <div class="row"><select id="msel" aria-label="Category"></select><input id="mq" type="search" autocomplete="off"></div>
        <div class="prices" id="mprices"></div>
      </div>
      <p class="status" id="status"></p>
      <main id="list"></main>
      <p class="empty" id="empty" data-i18n="empty">لا توجد نتائج مطابقة.</p>
    </div>
  </div>
</section>

<footer class="wrap"><p id="foot"></p></footer>

<button class="totop" id="totop" aria-label="Top">&uarr;</button>

<div class="pal" id="pal" role="dialog" aria-modal="true">
  <div class="palbox">
    <input id="pq" type="search" autocomplete="off">
    <div class="res" id="res"></div>
    <div class="palfoot"><span>↑ ↓</span><span>Enter</span><span>Esc</span></div>
  </div>
</div>

<script src="data.js"></script>
<script>
(function(){
  var S = window.SITE, C = window.CATEGORIES, D = window.DOMAINS || [], T = window.TOOLS;
  var COLORS = ["var(--cyan)","var(--pink)","var(--lime)","var(--violet)","#ffb02e"];
  var I18N = {
    ar:{chip:"دليل حيّ يُحدَّث باستمرار",sTools:"أداة منتقاة",sCats:"قسماً",sFree:"مجانية بالكامل",empty:"لا توجد نتائج مطابقة.",all:"كل الأدوات",
        visit:"زيارة",search:"ابحث عن أداة أو استخدام…",updated:"آخر تحديث",docTitle:"أدوات الذكاء الاصطناعي للتعليم",quick:"بحث سريع",
        explore:"استكشف الأدوات",e1:"مختارات",h1:"اختياراتي الأولى",l1:"الأدوات التي أستخدمها يومياً وأنصح بها قبل غيرها.",
        e2:"المجالات",h2:"ابدأ من حاجتك",l2:"اختر مجالاً لتنتقل مباشرة إلى أدواته.",e3:"الدليل الكامل",h3:"كل الأدوات",
        reset:"إلغاء كل التصفيات",showing:"يُعرض {n} من {t} أداة",palph:"اكتب اسم أداة أو قسم…",
        price:{free:"مجاني",freemium:"مجاني جزئياً",paid:"مدفوع"},
        phrases:["أدوات منتقاة للمعلم والباحث وواضع الاختبارات","الذكاء الاصطناعي في خدمة التعليم"]},
    en:{chip:"A living directory, updated regularly",sTools:"curated tools",sCats:"categories",sFree:"completely free",empty:"No matching results.",all:"All tools",
        visit:"Visit",search:"Search for a tool or use…",updated:"Last updated",docTitle:"AI Tools for Education",quick:"Quick search",
        explore:"Explore the tools",e1:"Featured",h1:"My Top Picks",l1:"The tools I use every day and recommend first.",
        e2:"Domains",h2:"Start from what you need",l2:"Pick a domain to jump straight to its tools.",e3:"Full directory",h3:"All tools",
        reset:"Clear all filters",showing:"Showing {n} of {t} tools",palph:"Type a tool or category…",
        price:{free:"Free",freemium:"Freemium",paid:"Paid"},
        phrases:["Hand-picked tools for teachers, researchers and test developers","AI in the service of education"]}
  };
  var lang = "ar";
  try{ var qp = new URLSearchParams(location.search).get("lang"); lang = (qp==="en"||qp==="ar") ? qp : (localStorage.getItem("lang")||"ar"); }catch(e){}
  if(lang!=="en") lang="ar";
  function L(k){ return I18N[lang][k]; }
  function pick(o,k){ return lang==="en" ? (o[k+"_en"]||o[k]||"") : (o[k]||""); }
  function catTitle(c){ return c ? (lang==="en" ? (c.en||c.title) : c.title) : ""; }
  function domTitle(d){ return lang==="en" ? (d.en||d.title) : d.title; }
  function priceLabel(p){ return I18N[lang].price[p]||""; }
  function esc(s){ return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function host(u){ try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return ""; } }
  function fav(u,sz){ return "https://www.google.com/s2/favicons?domain="+encodeURIComponent(host(u))+"&sz="+(sz||64); }
  function catById(id){ for(var i=0;i<C.length;i++) if(C[i].id===id) return C[i]; return null; }
  function domOf(cid){ for(var i=0;i<D.length;i++) if(D[i].cats.indexOf(cid)>=0) return D[i]; return D[0]; }
  var ITEMS = T.filter(function(t){ return t.cat!=="picks"; });
  var uniq = {}; T.forEach(function(t){ uniq[t.url]=t; });
  var U = Object.keys(uniq).map(function(k){ return uniq[k]; });
  var counts = { tools:U.length, cats:C.length-1, free:U.filter(function(t){return t.price==="free";}).length };

  function face(el, src){
    if(src){ el.innerHTML = '<img src="'+esc(src)+'" alt="'+esc(pick(S,"name"))+'">'; }
    else { var n = pick(S,"name").split(" "); el.textContent = n[0].charAt(0)+(n[1]?n[1].charAt(0):""); }
  }

  (function(){
    var a = U.filter(function(t,i){ return i%2===0; }).slice(0,40), b = U.filter(function(t,i){ return i%2===1; }).slice(0,40);
    function row(x){ var h = x.map(function(t){ return '<a class="logo" href="'+esc(t.url)+'" target="_blank" rel="noopener" tabindex="-1"><img loading="lazy" alt="" src="'+fav(t.url)+'">'+esc(t.name)+'</a>'; }).join(""); return h+h; }
    document.getElementById("t1").innerHTML = row(a);
    document.getElementById("t2").innerHTML = row(b);
  })();

  var state = {dom:"all", cat:"all", price:"all", q:""};

  function applyStatic(){
    var h = document.documentElement; h.lang = lang; h.dir = lang==="en" ? "ltr" : "rtl";
    ["chipName"].forEach(function(id){ document.getElementById(id).textContent = pick(S,"name"); });
    document.getElementById("intro").textContent = pick(S,"intro");
    face(document.getElementById("face"), S.photo);
    document.title = pick(S,"name")+" · "+L("docTitle");
    document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent = L(el.dataset.i18n); });
    ["q","mq"].forEach(function(id){ document.getElementById(id).placeholder = L("search"); });
    document.getElementById("pq").placeholder = L("palph");
    document.getElementById("foot").textContent = "© "+new Date().getFullYear()+" "+pick(S,"name")+" · "+L("updated")+" "+S.updated;
    document.querySelectorAll(".lang button").forEach(function(b){ b.classList.toggle("on", b.dataset.lang===lang); });
  }

  function buildRail(){
    document.getElementById("rail").innerHTML = T.filter(function(t){ return t.cat==="picks"; }).map(function(t){
      return '<a class="feat" href="'+esc(t.url)+'" target="_blank" rel="noopener"><div class="big"><img alt="" src="'+fav(t.url,128)+'"></div><h3>'+esc(t.name)+'</h3><p>'+esc(pick(t,"note"))+'</p>'+
        '<div class="bottom">'+(t.price?'<span class="tag '+t.price+'">'+priceLabel(t.price)+'</span>':'<span></span>')+'<span class="go">'+L("visit")+' <span class="arr">&larr;</span></span></div></a>';
    }).join("");
  }

  function domCount(d){ return ITEMS.filter(function(t){ return d.cats.indexOf(t.cat)>=0; }).length; }
  function buildBento(){
    document.getElementById("bento").innerHTML = D.map(function(d,i){
      return '<button class="dom" data-dom="'+d.id+'" style="--c:'+COLORS[i%5]+'"><span class="n">'+domCount(d)+'</span><h3>'+esc(domTitle(d))+'</h3><small>'+
        d.cats.map(function(c){ return esc(catTitle(catById(c))); }).join(" · ")+'</small></button>';
    }).join("");
  }
  document.getElementById("bento").addEventListener("click", function(e){
    var b = e.target.closest(".dom"); if(!b) return;
    state.dom = b.dataset.dom; state.cat = "all"; sync(); render();
    document.getElementById("directory").scrollIntoView({behavior:"smooth"});
  });

  function buildNav(){
    var t = '<button class="navall" data-dom="all">'+L("all")+' <em>'+ITEMS.length+'</em></button>';
    D.forEach(function(d){
      t += '<div class="dg" data-g="'+d.id+'"><button class="dn" data-dom="'+d.id+'">'+esc(domTitle(d))+' <em>'+domCount(d)+'</em></button><div class="cats">'+
        d.cats.map(function(c){ var n = ITEMS.filter(function(x){return x.cat===c;}).length; return '<button class="cn" data-cat="'+c+'">'+esc(catTitle(catById(c)))+' <em>'+n+'</em></button>'; }).join("")+'</div></div>';
    });
    document.getElementById("tree").innerHTML = t;
    var o = '<option value="all">'+L("all")+'</option>';
    D.forEach(function(d){ o += '<optgroup label="'+esc(domTitle(d))+'"><option value="d:'+d.id+'">'+esc(domTitle(d))+' — '+L("all")+'</option>'+
      d.cats.map(function(c){ return '<option value="c:'+c+'">'+esc(catTitle(catById(c)))+'</option>'; }).join("")+'</optgroup>'; });
    document.getElementById("msel").innerHTML = o;
    var p = ["free","freemium","paid"].map(function(k){ return '<button class="pf" data-price="'+k+'">'+priceLabel(k)+'</button>'; }).join("");
    document.getElementById("prices").innerHTML = p; document.getElementById("mprices").innerHTML = p;
  }
  function sync(){
    document.querySelectorAll(".navall").forEach(function(b){ b.classList.toggle("on", state.dom==="all"&&state.cat==="all"); });
    document.querySelectorAll(".dn").forEach(function(b){ b.classList.toggle("on", state.dom===b.dataset.dom&&state.cat==="all"); });
    document.querySelectorAll(".cn").forEach(function(b){ b.classList.toggle("on", state.cat===b.dataset.cat); });
    document.querySelectorAll(".dg").forEach(function(g){ g.classList.toggle("open", state.dom===g.dataset.g); });
    document.querySelectorAll(".pf").forEach(function(b){ b.classList.toggle("on", state.price===b.dataset.price); });
    document.getElementById("msel").value = state.cat!=="all" ? "c:"+state.cat : (state.dom!=="all" ? "d:"+state.dom : "all");
    if(document.getElementById("q").value!==state.q) document.getElementById("q").value = state.q;
    if(document.getElementById("mq").value!==state.q) document.getElementById("mq").value = state.q;
    document.getElementById("reset").classList.toggle("show", state.dom!=="all"||state.cat!=="all"||state.price!=="all"||!!state.q);
  }
  document.getElementById("tree").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    if(b.dataset.cat){ state.cat = b.dataset.cat; state.dom = domOf(b.dataset.cat).id; }
    else { state.dom = b.dataset.dom; state.cat = "all"; }
    sync(); render(); scrollToList();
  });
  document.getElementById("msel").addEventListener("change", function(){
    var v = this.value; if(v==="all"){ state.dom="all"; state.cat="all"; }
    else if(v.indexOf("d:")===0){ state.dom=v.slice(2); state.cat="all"; }
    else { state.cat=v.slice(2); state.dom=domOf(state.cat).id; }
    sync(); render();
  });
  function onPrice(e){ var b = e.target.closest(".pf"); if(!b) return; state.price = state.price===b.dataset.price ? "all" : b.dataset.price; sync(); render(); }
  document.getElementById("prices").addEventListener("click", onPrice);
  document.getElementById("mprices").addEventListener("click", onPrice);
  function onQ(e){ state.q = e.target.value.trim(); sync(); render(); }
  document.getElementById("q").addEventListener("input", onQ);
  document.getElementById("mq").addEventListener("input", onQ);
  document.getElementById("reset").addEventListener("click", function(){ state = {dom:"all",cat:"all",price:"all",q:""}; sync(); render(); });
  function scrollToList(){ var y = document.getElementById("directory").getBoundingClientRect().top + scrollY - 70; if(scrollY > y) scrollTo({top:y,behavior:"smooth"}); }

  var io = "IntersectionObserver" in window ? new IntersectionObserver(function(es){
    es.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } });
  },{threshold:.08}) : null;
  function card(t,i){
    var h = host(t.url), letter = esc((t.name||"?").charAt(0));
    return '<a class="card" href="'+esc(t.url)+'" target="_blank" rel="noopener" style="transition-delay:'+(i%8)*50+'ms">'+
      '<div class="top"><div class="ico"><img loading="lazy" alt="" src="'+fav(t.url)+'" onerror="this.replaceWith(document.createTextNode(\''+letter+'\'))"></div>'+
      '<div><div class="name">'+esc(t.name)+'</div><div class="host">'+esc(h)+'</div></div></div>'+
      '<p class="note">'+esc(pick(t,"note"))+'</p>'+
      '<div class="bottom">'+(t.price?'<span class="tag '+t.price+'">'+priceLabel(t.price)+'</span>':'<span></span>')+'<span class="go">'+L("visit")+' <span class="arr">&larr;</span></span></div></a>';
  }
  function match(t,c){
    if(state.price!=="all" && t.price!==state.price) return false;
    if(state.q){ var q = state.q.toLowerCase(), hay = (t.name+" "+(t.note||"")+" "+(t.note_en||"")+" "+c.title+" "+(c.en||"")+" "+t.url).toLowerCase(); if(hay.indexOf(q)<0) return false; }
    return true;
  }
  function render(){
    var html = "", total = 0;
    var cats = state.cat!=="all" ? [state.cat] : (state.dom!=="all" ? D.filter(function(d){return d.id===state.dom;})[0].cats : D.reduce(function(a,d){ return a.concat(d.cats); },[]));
    cats.forEach(function(cid){
      var c = catById(cid); if(!c) return;
      var items = ITEMS.filter(function(t){ return t.cat===cid && match(t,c); });
      if(!items.length) return; total += items.length;
      html += '<section class="cat" id="c-'+cid+'"><h3>'+esc(catTitle(c))+' <small>'+items.length+'</small></h3><div class="grid">'+items.map(card).join("")+'</div></section>';
    });
    var Lst = document.getElementById("list"); Lst.innerHTML = html;
    document.getElementById("empty").style.display = total ? "none" : "block";
    var filtered = state.dom!=="all"||state.cat!=="all"||state.price!=="all"||!!state.q;
    document.getElementById("status").textContent = filtered ? L("showing").replace("{n}",total).replace("{t}",ITEMS.length) : "";
    Lst.querySelectorAll(".card").forEach(function(el){ io ? io.observe(el) : el.classList.add("in"); });
  }

  var pal = document.getElementById("pal"), pq = document.getElementById("pq"), res = document.getElementById("res"), sel = 0, hits = [];
  function openPal(){ pal.classList.add("open"); pq.value=""; palSearch(); setTimeout(function(){ pq.focus(); },30); }
  function closePal(){ pal.classList.remove("open"); }
  function palSearch(){
    var q = pq.value.trim().toLowerCase(), seen = {};
    hits = ITEMS.filter(function(t){
      if(seen[t.url]) return false;
      var c = catById(t.cat), hay = (t.name+" "+(t.note||"")+" "+(t.note_en||"")+" "+c.title+" "+(c.en||"")).toLowerCase();
      var ok = !q || hay.indexOf(q)>=0; if(ok) seen[t.url]=1; return ok;
    });
    if(q) hits.sort(function(a,b){ return (a.name.toLowerCase().indexOf(q)===0?0:1)-(b.name.toLowerCase().indexOf(q)===0?0:1); });
    hits = hits.slice(0,40); sel = 0;
    res.innerHTML = hits.map(function(t,i){ return '<div class="ri'+(i===0?" act":"")+'" data-i="'+i+'"><img alt="" src="'+fav(t.url)+'"><div><div class="rn">'+esc(t.name)+'</div><div class="rc">'+esc(catTitle(catById(t.cat)))+'</div></div></div>'; }).join("") ||
      '<p style="padding:20px;color:var(--muted)">'+L("empty")+'</p>';
  }
  function mark(){ res.querySelectorAll(".ri").forEach(function(r,i){ r.classList.toggle("act", i===sel); if(i===sel) r.scrollIntoView({block:"nearest"}); }); }
  pq.addEventListener("input", palSearch);
  pq.addEventListener("keydown", function(e){
    if(e.key==="ArrowDown"){ sel = Math.min(sel+1, hits.length-1); mark(); e.preventDefault(); }
    else if(e.key==="ArrowUp"){ sel = Math.max(sel-1, 0); mark(); e.preventDefault(); }
    else if(e.key==="Enter" && hits[sel]){ window.open(hits[sel].url, "_blank", "noopener"); }
  });
  res.addEventListener("click", function(e){ var r = e.target.closest(".ri"); if(r) window.open(hits[+r.dataset.i].url, "_blank", "noopener"); });
  pal.addEventListener("click", function(e){ if(e.target===pal) closePal(); });
  document.getElementById("kbtn").addEventListener("click", openPal);
  document.addEventListener("keydown", function(e){
    if((e.ctrlKey||e.metaKey) && (e.key==="k"||e.key==="K")){ e.preventDefault(); pal.classList.contains("open") ? closePal() : openPal(); }
    else if(e.key==="Escape") closePal();
    else if(e.key==="/" && !/input|textarea|select/i.test(document.activeElement.tagName)){ e.preventDefault(); openPal(); }
  });

  var phrases = [], typed = document.getElementById("typed"), pi=0, ci=0, del=false, tmr=null;
  function type(){
    var p = phrases[pi]||""; typed.textContent = p.slice(0,ci);
    if(!del && ci<p.length){ ci++; tmr=setTimeout(type,42); } else if(!del){ del=true; tmr=setTimeout(type,2400); }
    else if(ci>0){ ci--; tmr=setTimeout(type,16); } else { del=false; pi=(pi+1)%phrases.length; tmr=setTimeout(type,400); }
  }
  function restartType(){ clearTimeout(tmr); pi=0; ci=0; del=false; type(); }
  function countUp(){
    document.querySelectorAll("[data-count]").forEach(function(el){
      var end = counts[el.dataset.count], t0 = performance.now();
      (function step(now){ var k = Math.min(1,(now-t0)/1600), e = 1-Math.pow(1-k,3); el.textContent = Math.round(end*e); if(k<1) requestAnimationFrame(step); })(t0);
    });
  }

  function setLang(l, initial){
    lang = l;
    try{ localStorage.setItem("lang", l); }catch(e){}
    try{ var url = new URL(location.href); if(l==="en") url.searchParams.set("lang","en"); else url.searchParams.delete("lang"); history.replaceState(null,"",url.toString()); }catch(e){}
    applyStatic(); buildRail(); buildBento(); buildNav(); sync(); render();
    phrases = [pick(S,"title")].concat(L("phrases"));
    if(!initial) restartType();
  }
  document.querySelector(".lang").addEventListener("click", function(e){ var b = e.target.closest("button[data-lang]"); if(b && b.dataset.lang!==lang) setLang(b.dataset.lang); });
  setLang(lang, true);

  var heroInner = document.getElementById("heroInner"), topbar = document.getElementById("topbar"), TT = document.getElementById("totop");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  addEventListener("scroll", function(){
    var y = scrollY, h = innerHeight;
    if(!reduce && y < h){ var k = y/h; heroInner.style.transform = "translateY("+(y*0.35)+"px) scale("+(1-k*0.08)+")"; heroInner.style.opacity = String(Math.max(0,1-k*1.2)); }
    topbar.classList.toggle("solid", y > 40);
    TT.classList.toggle("show", y > h*1.5);
  }, {passive:true});
  TT.addEventListener("click", function(){ scrollTo({top:0,behavior:"smooth"}); });
  var rio = "IntersectionObserver" in window ? new IntersectionObserver(function(es){ es.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add("in"); rio.unobserve(en.target); } }); },{threshold:.1}) : null;
  document.querySelectorAll(".rv").forEach(function(el){ rio ? rio.observe(el) : el.classList.add("in"); });

  if(window.matchMedia("(hover:hover)").matches){
    document.addEventListener("mousemove", function(e){
      var c = e.target.closest && e.target.closest(".card"); if(!c) return;
      var r = c.getBoundingClientRect(), x = e.clientX-r.left, y = e.clientY-r.top;
      c.style.setProperty("--mx",x+"px"); c.style.setProperty("--my",y+"px");
      c.style.transform = "perspective(800px) rotateX("+((y/r.height-.5)*-6)+"deg) rotateY("+((x/r.width-.5)*6)+"deg) translateY(-4px)";
    });
    document.addEventListener("mouseout", function(e){ var c = e.target.closest && e.target.closest(".card"); if(c && !c.contains(e.relatedTarget)) c.style.transform=""; });
  }

  var cv = document.getElementById("net"), ctx = cv.getContext("2d"), W, H, pts=[], mouse={x:-999,y:-999};
  var PC = ["0,240,255","255,43,214","182,255,59","139,92,246"];
  function size(){
    var d = Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*d; cv.height=H*d; ctx.setTransform(d,0,0,d,0,0);
    var n = Math.round(Math.min(100, W*H/15000)); pts=[];
    for(var i=0;i<n;i++) pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.8+.6,c:PC[i%4],p:Math.random()*6.28});
  }
  addEventListener("resize", size);
  addEventListener("mousemove", function(e){ mouse.x=e.clientX; mouse.y=e.clientY; });
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<pts.length;i++){
      var a=pts[i]; a.x+=a.vx; a.y+=a.vy; a.p+=.03;
      if(a.x<0||a.x>W) a.vx*=-1; if(a.y<0||a.y>H) a.vy*=-1;
      var dx=mouse.x-a.x, dy=mouse.y-a.y, dm=Math.sqrt(dx*dx+dy*dy);
      if(dm<180){ a.x+=dx*.006; a.y+=dy*.006; }
      for(var j=i+1;j<pts.length;j++){ var b=pts[j], ex=a.x-b.x, ey=a.y-b.y, d=ex*ex+ey*ey;
        if(d<15000){ ctx.strokeStyle="rgba("+a.c+","+(.22*(1-d/15000))+")"; ctx.lineWidth=.7; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); } }
      if(dm<180){ ctx.strokeStyle="rgba("+a.c+","+(.5*(1-dm/180))+")"; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(mouse.x,mouse.y); ctx.stroke(); }
      ctx.fillStyle="rgba("+a.c+","+(.6+.4*Math.sin(a.p))+")"; ctx.shadowBlur=12; ctx.shadowColor="rgba("+a.c+",1)";
      ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,6.28); ctx.fill(); ctx.shadowBlur=0;
    }
    requestAnimationFrame(draw);
  }

  setTimeout(function(){
    document.body.classList.add("ready");
    setTimeout(type, 1600); setTimeout(countUp, 1200);
    if(!reduce){ size(); draw(); }
  }, 150);
})();
</script>
</body>
